apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mcp-server-monitor
  namespace: monitoring
  labels:
    # IMPORTANT: This must match the label your Prometheus instance is looking for
    release: kube-prometheus-stack 
spec:
  selector:
    matchLabels:
      app: mcp-server # Matches the label in your Service
  namespaceSelector:
    matchNames:
      - mcp-prod # The namespace where your app lives
  endpoints:
  - port: http # This matches the 'name: http' you added to the Service ports
    path: /actuator/prometheus
    interval: 15s