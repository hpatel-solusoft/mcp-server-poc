# ==========================================
# 1. NETWORK ISOLATION (Kill Vault)
# ==========================================
# We explicitly tell Spring: "Don't even try to talk to Vault"
spring.cloud.vault.enabled=false

# ==========================================
# 2. DUMMY SECRETS (Prevent the Crash)
# ==========================================
# Since Vault is off, Spring won't find these values.
# We MUST provide fake ones here so the @Value("${...}") injections don't fail.
case360.username=fake-test-user
case360.password=fake-test-password
# Add any other property your app expects from Vault here!

# ==========================================
# 3. DATABASE OVERRIDE (Postgres -> H2)
# ==========================================
# This overrides the "jdbc:postgresql://..." from your main file
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for tests if you don't want to run migrations on H2
spring.flyway.enabled=false