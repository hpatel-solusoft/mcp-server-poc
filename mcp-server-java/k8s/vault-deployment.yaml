apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: mcp-prod
data:
  local.json: |
    {
      "storage": {
        "file": {
          "path": "/vault/file"
        }
      },
      "listener": {
        "tcp": {
          "address": "0.0.0.0:8200",
          "tls_disable": 1
        }
      },
      "ui": true,
      "disable_mlock": true
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: mcp-prod
spec:
  serviceName: "vault-service"
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: vault
        image: hashicorp/vault:latest
        ports:
        - containerPort: 8200
        env:
        - name: VAULT_ADDR
          value: "http://127.0.0.1:8200"
        command: ["vault", "server", "-config=/vault/config/local.json"]
        volumeMounts:
        - name: vault-config
          mountPath: /vault/config
        - name: vault-data
          mountPath: /vault/file
      volumes:
      - name: vault-config
        configMap:
          name: vault-config
  volumeClaimTemplates:
  - metadata:
      name: vault-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: mcp-prod
spec:
  type: LoadBalancer
  selector:
    app: vault
  ports:
  - protocol: TCP
    port: 8201       # Corrected: Stays on 8201 to avoid Dev conflict
    targetPort: 8200
    nodePort: 32200