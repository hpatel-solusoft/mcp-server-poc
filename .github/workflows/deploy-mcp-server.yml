name: MCP Server CI/CD

# Trigger on push to master, but ONLY if changes happen in the Java folder
on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'mcp-server-java/**'
      - '.github/workflows/deploy-mcp-server.yml'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'mcp-server-java/**'

jobs:
  # JOB 1: BUILD & TEST (The Quality Gate)
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp-server-java # Crucial: Your pom.xml is in this subfolder

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Automatically caches .m2 to speed up builds

      - name: Build and Run Tests
        # This will now pass because we fixed your tests to use H2 and mock Vault
        run: mvn clean verify

      - name: Publish Test Report
        if: always() # Run even if tests fail so you see WHY
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  # JOB 2: DOCKER PUBLISH (Runs only if tests pass)
  docker-publish:
    needs: build-and-test # Dependency: Don't push broken code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # Don't push Docker images on Pull Requests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server-java
          file: ./mcp-server-java/Dockerfile
          push: true
          # Tags the image with 'latest' AND the specific git commit SHA for rollback safety
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/claims-mcp-server:latest
            ${{ secrets.DOCKER_USERNAME }}/claims-mcp-server:${{ github.sha }}
            
  # JOB 3: UPDATE K8S MANIFEST (The GitOps Trigger)
  update-manifest:
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # You will need to create a Personal Access Token (PAT) 
          # with 'repo' scope and add it to GitHub Secrets as GITOPS_PAT
          token: ${{ secrets.GITOPS_PAT }} 

      - name: Update Image Tag
        run: |
          # Replaces the image tag in your manifest with the new Git SHA
          sed -i 's|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/claims-mcp-server:${{ github.sha }}|g' ./mcp-server-javak8s/mcp-server-deployment.yaml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8/mcp-server-deployment.yaml
          git commit -m "chore: update k8s image tag to ${{ github.sha }} [skip ci]"
          git push