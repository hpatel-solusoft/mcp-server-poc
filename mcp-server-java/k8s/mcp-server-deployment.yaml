apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-claims-server
  namespace: mcp-prod
spec:
  replicas: 2 
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: hpatelsolusoft/claims-mcp-server:12e4d82308e259ad6f703789855261eedc6ea862
        ports:
        - containerPort: 9090
        # FIXED: Indentation for 'env' was shifted too far right
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "9090"
        - name: CASE360_URL
          value: "http://122.169.108.196:8080/sonora/soap/Ws"
        - name: SPRING_CLOUD_VAULT_URI
          value: "http://vault-service:8201"
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://postgres-service:5432/mcp_db"
        - name: SPRING_DATASOURCE_USERNAME
          value: "mcp_user"
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mcp-secrets
              key: db-password
        - name: VAULT_ROLE_ID
          valueFrom:
            secretKeyRef:
              name: mcp-secrets
              key: vault-role-id
        - name: VAULT_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: mcp-secrets
              key: vault-secret-id
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 9090
          initialDelaySeconds: 45
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 9090
          initialDelaySeconds: 45
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: mcp-prod
spec:
  type: LoadBalancer
  selector:
    app: mcp-server
  ports:
  - protocol: TCP
    port: 9091
    targetPort: 9090
    nodePort: 30091