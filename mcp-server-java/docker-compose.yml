version: "3.8"

services:
  # ----------------------------------------------------------------
  # 1. THE FIXER (New Service)
  # Runs once, fixes permissions on the volume, then exits.
  # ----------------------------------------------------------------
  vault-fixer:
    image: alpine:latest
    container_name: mcp-vault-fixer
    command: ["sh", "-c", "chown -R 100:1000 /vault/file || true"]
    volumes:
      - vault-data:/vault/file

  # ----------------------------------------------------------------
  # 2. VAULT
  # ----------------------------------------------------------------
  vault:
    image: hashicorp/vault:latest
    container_name: mcp-vault
    ports:
      - "8200:8200" 
    volumes:
      - ./vault/config:/vault/config
      - vault-data:/vault/file
    cap_add:
      - IPC_LOCK
    environment:
      # CLI inside container uses this; your app should use http://vault:8200
      VAULT_ADDR: "http://127.0.0.1:8200"
    command: vault server -config=/vault/config/local.json
    depends_on:
      - vault-fixer

  # ----------------------------------------------------------------
  # 3. POSTGRES (Database)
  # ----------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: mcp-postgres
    environment:
      - POSTGRES_USER=mcp_user
      - POSTGRES_PASSWORD=secret_password
      - POSTGRES_DB=mcp_db
    ports:
      - "5432:5432"
    restart: always

  # ----------------------------------------------------------------
  # 4. SPRING BOOT APP
  # ----------------------------------------------------------------
  mcp-server:
    build: .
    container_name: mcp-claims-server
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Fill this after you create a token in Vault
      - VAULT_TOKEN=placeholder-token
      - CASE360_URL=http://host.docker.internal:8080/sonora/soap/Ws
      - CASE360_OVERRIDE_HOST=localhost:8080
      # Strongly recommended so app talks to the vault container, not localhost
      - SPRING_VAULT_URI=http://vault:8200
    depends_on:
      - postgres
      - vault
    restart: on-failure

volumes:
  vault-data:
