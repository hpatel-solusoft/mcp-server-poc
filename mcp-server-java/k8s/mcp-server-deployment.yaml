apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: mcp-prod
  labels:                      # RESTORED: Required for ServiceMonitor/Prometheus
    app: mcp-server
spec:
  type: LoadBalancer
  selector:
    app: mcp-server
  ports:
    - name: http                 # MANDATORY: Matches ServiceMonitor endpoint port
      protocol: TCP
      port: 9091                 # External Access
      targetPort: 9090           # Internal Container Port
      nodePort: 30091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-claims-server
  namespace: mcp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: hpatelsolusoft/claims-mcp-server:e2750081f76f037f3c5699711908a7016e39dde5
          ports:
            - name: http
              containerPort: 9090
          resources:             # Added to prevent GC pauses/timeouts
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "9090"
            - name: SPRING_AI_MCP_SERVER_PROTOCOL
              value: "STATELESS"
            - name: TZ
              value: "UTC"       # Fixes JobRunr clock-drift
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            
            # JobRunr Stability Fixes
            - name: ORG_JOBRUNR_SERVER_POLL_INTERVAL
              value: "30"
            - name: ORG_JOBRUNR_SERVER_UNANNOUNCED_JOB_SERVER_OUTDATED_THRESHOLD
              value: "PT5M"

            # Infrastructure (FQDN)
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.mcp-prod.svc.cluster.local:5432/mcp_db"
            - name: SPRING_CLOUD_VAULT_URI
              value: "http://vault-service.mcp-prod.svc.cluster.local:8201"

            # Case360 Credentials (Fixes PlaceholderResolutionException)
            - name: CASE360_URL
              value: "http://122.169.108.196:8080/sonora/soap/Ws"
            - name: CASE360_USERNAME
              value: "your_actual_username" 
            - name: CASE360_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: case360-password

            # Secrets Mapping
            - name: SPRING_DATASOURCE_USERNAME
              value: "mcp_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: db-password
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: vault-role-id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: vault-secret-id
          
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 90 # Increased for stable startup
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 90
            periodSeconds: 20