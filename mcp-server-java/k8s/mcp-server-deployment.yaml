apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-claims-server
  namespace: mcp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
        - name: mcp-server
          image: hpatelsolusoft/claims-mcp-server:8ffeea698a68e40d89dd1bf0d05eaf5195681d0e
          ports:
            - name: http
              containerPort: 9090
          env:
            # 1. CORE SPRING SETTINGS
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SERVER_PORT
              value: "9090"
            - name: SPRING_AI_MCP_SERVER_PROTOCOL
              value: "STATELESS"

            # 2. INFRASTRUCTURE (Using FQDN for stability)
            # Format: <service-name>.<namespace>.svc.cluster.local
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service.mcp-prod.svc.cluster.local:5432/mcp_db"
            - name: SPRING_CLOUD_VAULT_URI
              value: "http://vault-service.mcp-prod.svc.cluster.local:8201"

            # 3. EXTERNAL INTEGRATION (Resolves the case360.username error)
            - name: CASE360_URL
              value: "http://122.169.108.196:8080/sonora/soap/Ws"
            - name: CASE360_USERNAME
              value: "your_username_here" # Matches ${case360.username}
            - name: CASE360_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: case360-password

            # 4. CREDENTIALS & SECRETS
            - name: SPRING_DATASOURCE_USERNAME
              value: "mcp_user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: db-password
            - name: VAULT_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: vault-role-id
            - name: VAULT_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: mcp-secrets
                  key: vault-secret-id
          
          # 5. PRODUCTION-GRADE PROBES
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 60 # Allows JVM/Flyway to finish
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 15