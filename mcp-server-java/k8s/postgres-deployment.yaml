apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: mcp-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "mcp_user"
        - name: POSTGRES_PASSWORD
          value: "secret_password"
        - name: POSTGRES_DB
          value: "mcp_db"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: mcp-prod
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432